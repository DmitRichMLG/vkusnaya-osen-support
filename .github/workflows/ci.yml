# Проверка на каждый push в main и pull request. Повторяет путь проверяющего:
# cp .env.example .env → docker compose up, затем тесты и форматирование внутри контейнера.
# Ключи Telegram и Gemini не нужны: тесты и панель без них работают.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Подготовить .env из примера
        run: cp .env.example .env

      - name: Собрать образ и поднять postgres и web (миграции и сидер делает entrypoint)
        run: docker compose up -d --build --wait web

      - name: Тесты на Postgres (база testing)
        run: docker compose exec -T web php artisan test

      - name: Форматирование (pint)
        run: docker compose exec -T web ./vendor/bin/pint --test

      - name: Логи контейнеров при сбое
        if: failure()
        run: docker compose logs --tail=200 postgres web

      - name: Остановить и удалить тома
        if: always()
        run: docker compose down -v
